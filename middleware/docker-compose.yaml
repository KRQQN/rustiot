services:

  influxdb:
    build:
      context: ./influxdb

    container_name: dc_influxdb

    ports:
      - "8181:8181"

    volumes:
      - influxdb_data:/var/lib/influxdb3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "TOKEN=$$(sed -n 's/.*\"token\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p' /var/lib/influxdb3/influx-token.json) && curl -sf -H \"Authorization: Bearer $$TOKEN\" http://localhost:8181/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    
    restart: unless-stopped


  emqx:
    image: emqx/emqx:latest

    container_name: dc_emqx

    ports:
      - "1883:1883"
      - "18083:18083"

    environment:
      EMQX_NAME: emqx

    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log

    restart: unless-stopped


  middleware:
    build:
      context: .

    container_name: middleware

    env_file:
      - .env

    volumes:
      - influxdb_data:/run/influx-data:ro

    depends_on:
      influxdb:
        condition: service_healthy
      emqx:
        condition: service_started

    restart: unless-stopped


volumes:
  influxdb_data:
  emqx_data:
  emqx_log:
