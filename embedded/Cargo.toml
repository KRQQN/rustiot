[workspace]

[package]
edition = "2024"
name = "embedded"
rust-version = "1.88"
version = "0.1.0"

[[bin]]
name = "embedded"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s3", "unstable"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-rtos = { version = "0.3.0", features = [
    "embassy",
    "esp32s3",
    "esp-radio",
] }
esp-alloc = "0.10"
static_cell = "2.1"
embedded-storage = "0.3"
esp-storage = {
    git = "https://github.com/embassy-rs/esp-hal.git",
    rev = "7af0919e56e8298a7cb429da7f078757e350d842",
    features = ["esp32s3", "embedded-storage"]
}

# Connection
esp-radio = {
    version = "1.0.0-beta.0",
    features = [
        "esp32s3",
        "wifi",
        "ble",
        "coex",
        "log-04",
        "unstable",
        #"print-logs-from-driver",
    ],
}
embassy-net = { version = "0.9", features = ["dhcpv4", "tcp", "udp", "dns", "medium-ethernet"] }
rust-mqtt = { version = "0.5.1", default-features = false, features = ["v5", "alloc", "log"] }
trouble-host = { git = "https://github.com/embassy-rs/trouble", features = ["default-packet-pool-mtu-255", "security"] }
heapless = "0.9"


# Embassy
embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5"
embassy-sync = "0.8"
embassy-futures = { version = "0.1", default-features = false }

# Sensors
embedded-dht-rs = { version = "0.5", features = ["dht11"] }

# Logging / panic
esp-backtrace = { version = "0.19.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
log = "0.4"

critical-section = "1.2.0"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2         # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'

[patch.crates-io]
esp-alloc =             { git = "https://github.com/embassy-rs/esp-hal.git", rev="7af0919e56e8298a7cb429da7f078757e350d842" }
esp-backtrace =         { git = "https://github.com/embassy-rs/esp-hal.git", rev="7af0919e56e8298a7cb429da7f078757e350d842" }
esp-bootloader-esp-idf ={ git = "https://github.com/embassy-rs/esp-hal.git", rev="7af0919e56e8298a7cb429da7f078757e350d842" }
esp-hal =               { git = "https://github.com/embassy-rs/esp-hal.git", rev="7af0919e56e8298a7cb429da7f078757e350d842" }
esp-println =           { git = "https://github.com/embassy-rs/esp-hal.git", rev="7af0919e56e8298a7cb429da7f078757e350d842" }
esp-radio =             { git = "https://github.com/embassy-rs/esp-hal.git", rev="7af0919e56e8298a7cb429da7f078757e350d842" }
esp-rtos =              { git = "https://github.com/embassy-rs/esp-hal.git", rev="7af0919e56e8298a7cb429da7f078757e350d842" }
